<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Golden Circle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Maplibre GL -->
    <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

    <!-- Maplibre GL Leaflet  -->
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>

    <link rel="stylesheet" href="main.css">

</head>

<body>

    <div id="controls">
        <div class="search-bar">
            <input type="text" id="address-input" placeholder="Search location..." />
            <button id="toggle-options-btn" type="button" aria-label="Settings"><img src="gear.svg" alt=""
                    class="icon-svg" /></button>
            <button id="search-btn">Go</button>
        </div>

        <div id="options-foldout">
            <div class="control-group">
                <label>Mode of Transport</label>
                <div class="radio-group">
                    <label><input type="radio" name="mode" value="walk" checked> Walk</label>
                    <label><input type="radio" name="mode" value="bicycle"> Bike</label>
                    <label><input type="radio" name="mode" value="drive"> Drive</label>
                </div>
            </div>

            <div class="control-group">
                <label for="time-input">Travel Time (minutes)</label>
                <input type="number" id="time-input" value="15" min="1" max="120" />
            </div>

            <div id="pub-list-container">
                <div class="pub-list-title" id="pub-count-header">Pubs in Reach</div>
                <div id="pub-status" class="pub-status"></div>
                <ul id="pub-list"></ul>
            </div>
        </div>
    </div>

    <div id="map"></div>



</body>
<script src="main.js"></script>

</html>
